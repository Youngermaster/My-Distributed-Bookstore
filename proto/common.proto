syntax = "proto3";

package common;

option go_package = "github.com/youngermaster/distributed-bookstore/proto/common";

// Common timestamp message
message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

// Common pagination request
message PaginationRequest {
  int32 page = 1;
  int32 page_size = 2;
}

// Common pagination response
message PaginationResponse {
  int32 total = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total_pages = 4;
}

// Common error response
message ErrorResponse {
  string code = 1;
  string message = 2;
  map<string, string> details = 3;
}

// Common success response
message SuccessResponse {
  bool success = 1;
  string message = 2;
}
