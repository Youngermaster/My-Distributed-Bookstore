version: '3.9'

services:
  # PostgreSQL Database for Catalog Service
  postgres:
    image: postgres:15-alpine
    container_name: bookstore-postgres
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: catalog_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookstore-network
    restart: unless-stopped

  # Catalog Service
  catalog-service:
    build:
      context: ../catalog-service
      dockerfile: Dockerfile
    container_name: catalog-service
    environment:
      HTTP_PORT: 8081
      GRPC_PORT: 50051
      ENV: development
      DATABASE_URL: postgresql://bookstore:dev_password@postgres:5432/catalog_db?sslmode=disable
    ports:
      - "8081:8081"
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bookstore-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      PORT: 8080
      ENV: development
      CATALOG_SERVICE_URL: http://catalog-service:8081
      RATE_LIMIT_ENABLED: "false"
      RATE_LIMIT_MAX: 900
      RATE_LIMIT_WINDOW: 1m
      ALLOWED_ORIGINS: "*"
      REQUEST_TIMEOUT: 30s
      JWT_SECRET: dev_jwt_secret_change_in_production
    ports:
      - "8080:8080"
    depends_on:
      catalog-service:
        condition: service_healthy
    networks:
      - bookstore-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:

networks:
  bookstore-network:
    name: bookstore-network
    driver: bridge
