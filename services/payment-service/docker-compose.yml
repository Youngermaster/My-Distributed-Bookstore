version: '3.9'

services:
  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8085:8085"
      - "50055:50055"
    environment:
      PORT: 8085
      GRPC_PORT: 50055
      NODE_ENV: development
      DATABASE_URL: postgresql://bookstore:dev_password@postgres:5432/payments_db?schema=public
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_xxx}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_xxx}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_xxx}
      RABBITMQ_URL: amqp://bookstore:dev_password@rabbitmq:5672/
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: 6831
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bookstore-payment-network
    restart: unless-stopped
    volumes:
      - ./src:/app/src
      - /app/node_modules

  postgres:
    image: postgres:15-alpine
    container_name: payment-service-postgres
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: payments_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookstore-payment-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: payment-service-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: bookstore
      RABBITMQ_DEFAULT_PASS: dev_password
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - bookstore-payment-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  bookstore-payment-network:
    name: bookstore-payment-network
    driver: bridge
