version: '3.9'

services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8082:8082"
      - "50052:50052"
    environment:
      HTTP_PORT: "8082"
      GRPC_PORT: "50052"
      DATABASE_URL: postgresql://bookstore:dev_password@postgres:5432/users_db?sslmode=disable
      JWT_SECRET: dev-secret-key-change-in-production-min-32-chars-long
      JWT_ACCESS_DURATION: 24h
      JWT_REFRESH_DURATION: 168h
      BCRYPT_COST: "12"
      ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bookstore-user-network
    restart: unless-stopped
    volumes:
      - ./cmd:/app/cmd
      - ./internal:/app/internal
      - ./pkg:/app/pkg
    command: go run ./cmd/server/main.go

  postgres:
    image: postgres:15-alpine
    container_name: user-service-postgres
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: users_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookstore-user-network

volumes:
  postgres_data:

networks:
  bookstore-user-network:
    driver: bridge
