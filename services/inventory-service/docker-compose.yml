version: '3.9'

services:
  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-service
    ports:
      - "8086:8086"
    environment:
      DEBUG: "True"
      DATABASE_URL: postgresql+asyncpg://bookstore:dev_password@postgres:5432/inventory_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bookstore-inventory-network
    restart: unless-stopped
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8086 --reload

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: inventory_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookstore-inventory-network

volumes:
  postgres_data:

networks:
  bookstore-inventory-network:
    driver: bridge
