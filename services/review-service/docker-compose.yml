version: '3.9'

services:
  review-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: review-service
    ports:
      - "8088:8088"
    environment:
      APP_NAME: Review Service
      DEBUG: "True"
      HOST: 0.0.0.0
      PORT: 8088
      DATABASE_URL: postgresql+asyncpg://bookstore:dev_password@postgres:5432/reviews_db
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bookstore-review-network
    restart: unless-stopped
    volumes:
      # Mount source code for development (hot reload)
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8088 --reload

  postgres:
    image: postgres:15-alpine
    container_name: review-service-postgres
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: reviews_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookstore-review-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  bookstore-review-network:
    name: bookstore-review-network
    driver: bridge
