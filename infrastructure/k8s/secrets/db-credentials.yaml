apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: bookstore-dev
type: Opaque
stringData:
  POSTGRES_USER: bookstore
  POSTGRES_PASSWORD: dev_password
  POSTGRES_DB: catalog_db
  DATABASE_URL: postgresql://bookstore:dev_password@postgres:5432/catalog_db?sslmode=disable
  # Additional keys for individual services
  catalog_password: dev_password
  user_password: dev_password
  order_password: dev_password
