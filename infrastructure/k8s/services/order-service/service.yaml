apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: production
  labels:
    app: order-service
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8084
    protocol: TCP
  - name: grpc
    port: 50054
    targetPort: 50054
    protocol: TCP
  selector:
    app: order-service
