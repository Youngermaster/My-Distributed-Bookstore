apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: bookstore-dev
  labels:
    app: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
      - name: inventory-service
        image: 905418472239.dkr.ecr.us-east-1.amazonaws.com/inventory-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8086
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: inventory-service-secrets
              key: DATABASE_URL
        envFrom:
        - configMapRef:
            name: inventory-service-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8086
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8086
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
