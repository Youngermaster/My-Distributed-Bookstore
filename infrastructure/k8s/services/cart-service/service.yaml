apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: production
  labels:
    app: cart-service
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8083
    protocol: TCP
  - name: grpc
    port: 50053
    targetPort: 50053
    protocol: TCP
  selector:
    app: cart-service
