apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: production
  labels:
    app: cart-service
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cart-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cart-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: cart-service-sa

      # Anti-affinity for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: cart-service
              topologyKey: kubernetes.io/hostname

      containers:
      - name: cart-service
        image: cart-service:latest
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 8083
          protocol: TCP
        - name: grpc
          containerPort: 50053
          protocol: TCP

        env:
        - name: HTTP_PORT
          value: "8083"
        - name: GRPC_PORT
          value: "50053"
        - name: ENV
          value: "production"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: cart-service-secrets
              key: redis-url
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cart-service-secrets
              key: redis-password
        - name: CATALOG_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: cart-service-config
              key: catalog-service-url
        - name: CART_TTL
          valueFrom:
            configMapKeyRef:
              name: cart-service-config
              key: cart-ttl
        - name: LOG_LEVEL
          value: "info"

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /ready
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        volumeMounts:
        - name: tmp
          mountPath: /tmp

      volumes:
      - name: tmp
        emptyDir: {}
