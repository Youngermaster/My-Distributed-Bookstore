apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: production
  labels:
    app: user-service
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8082
    protocol: TCP
  - name: grpc
    port: 50052
    targetPort: 50052
    protocol: TCP
  selector:
    app: user-service
