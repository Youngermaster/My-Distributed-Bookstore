apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: bookstore-dev
  labels:
    app: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: 905418472239.dkr.ecr.us-east-1.amazonaws.com/user-service:latest
        imagePullPolicy: Always  # Change to Always for EKS with ECR
        ports:
        - containerPort: 8082
          name: http
        env:
        - name: DATABASE_URL
          value: "postgresql://userservice:dev_password@postgres:5432/userdb?sslmode=disable"
        - name: PORT
          value: "8082"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
