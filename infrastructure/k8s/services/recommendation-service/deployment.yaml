apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: bookstore-dev
  labels:
    app: recommendation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      containers:
      - name: recommendation-service
        image: recommendation-service:latest
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8089
          protocol: TCP
        envFrom:
        - configMapRef:
            name: recommendation-service-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: recommendation-service-secrets
              key: DATABASE_URL
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            cpu: 400m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8089
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/ready
            port: 8089
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
