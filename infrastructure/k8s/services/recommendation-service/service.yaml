apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  namespace: production
  labels:
    app: recommendation-service
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8089
    protocol: TCP
  - name: grpc
    port: 50059
    targetPort: 50059
    protocol: TCP
  selector:
    app: recommendation-service
