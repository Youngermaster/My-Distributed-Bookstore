apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: bookstore-dev
data:
  HTTP_PORT: "8082"
  GRPC_PORT: "50052"
  ENV: "development"
  JWT_ACCESS_DURATION: "24h"
  JWT_REFRESH_DURATION: "168h"
  BCRYPT_COST: "12"
  CORS_ALLOW_ORIGINS: "http://localhost:3000,http://localhost:30080,http://localhost:8080"
  CORS_ALLOW_CREDENTIALS: "true"
  DB_MAX_IDLE_CONNS: "10"
  DB_MAX_OPEN_CONNS: "50"
  LOG_LEVEL: "debug"
  RABBITMQ_URL: "amqp://bookstore:dev_password@rabbitmq:5672/"
  RABBITMQ_EXCHANGE: "bookstore.events"
